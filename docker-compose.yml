services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas-backend
    restart: always
    expose:
      - "8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - DATA_PATH=/app/data/materials
      - CHROMA_PATH=/app/data/chroma_db
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - TF_ENABLE_ONEDNN_OPTS=0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atlas-frontend
    restart: always
    ports:
      - "47291:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: atlas-network
    driver: bridge

volumes:
  data:
    driver: local
